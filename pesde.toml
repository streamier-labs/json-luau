name = "streamier/json"
version = "0.1.0"
description = "A lightweight, pure Luau JSON encoder and decoder module adhering strictly to the RFC 8259 specification."
authors = [
  "Amir Farzamnia <amirfarzamnia@proton.me> (https://github.com/amirfarzamnia)",
]
repository = "https://github.com/streamier-labs/json-luau"
license = "MIT"
includes = ["pesde.toml", "README.md", "LICENSE"]

[target]
environment = "luau"
lib = "dist/main.luau"

[scripts]
build = "scripts/build.luau"
test = "scripts/test.luau"

[indices]
default = "https://github.com/pesde-pkg/index"
